<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Köszönjük feliratkozását!</title>
  <style>
    /* Teljes oldal középre igazítása és modern betűtípus */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f9fa;
      color: #333;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* A köszönő kártya stílusa */
    .thank-you-card {
      background-color: #ffffff;
      padding: 40px 30px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    /* Nagy zöld pipa ikon */
    .success-icon {
      font-size: 60px;
      color: #28a745;
      margin-bottom: 20px;
      line-height: 1;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 10px 0;
      color: #212529;
    }

    p {
      font-size: 16px;
      color: #6c757d;
      margin: 0 0 25px 0;
    }

    /* Vissza a főoldalra gomb */
    .back-btn {
      display: inline-block;
      text-decoration: none;
      background-color: #007bff;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 4px;
      font-weight: 600;
      transition: background-color 0.2s;
    }

    .back-btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="thank-you-card">
    <div class="success-icon">✓</div>
    <h1>Köszönjük feliratkozását!</h1>
    <p>Sikeresen regisztráltál a listánkra.</p>
    <a href="index.html" class="back-btn">Vissza a főoldalra</a>
  </div>

</body>
</html>
